[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darija-rag-platform"
version = "2.0.0"
description = "Multi-tenant enterprise knowledge platform: Arabic/Algerian-Darija/French RAG with document-level access control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "rq>=1.16",
  "pyjwt>=2.8",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "pypdf>=4.0",
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk>=1.24",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom; E501: handled by formatter
